[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

[[redirects]]
  from = "/api/speak"
  to = "/.netlify/functions/speak"
  status = 200
