name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIA_MODEL: test
  PYDANTIC_AI_NO_BANNER: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy node/mia

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Unit tests, no network; fails under 80% coverage of mia/core (see pyproject addopts).
      - run: uv run pytest
      # The quick start must work on a clean machine.
      - run: cp .env.example .env && uv run mia migrate && uv run mia seed
      - run: uv run mia chat "Olen kipeä huomenna." --as Juha

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest node/tests/evals -m evals -s
