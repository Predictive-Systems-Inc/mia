[project]
name = "mia-node"
version = "0.1.0"
description = "Mia Node: local-first AI ERP for businesses that run on shifts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-ai-slim[openai,ag-ui]>=2.52,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pycasbin>=1.36",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.scripts]
mia = "mia.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["node/mia"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["netlify"]
src = ["node"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"node/tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "node"
packages = ["mia"]
warn_unused_configs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["mia.core.*", "mia.chat.*", "mia.agents.*"]
strict = true

[[tool.mypy.overrides]]
module = ["casbin.*", "ulid.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["node/tests"]
pythonpath = ["node"]
addopts = "-m 'not evals' --cov=mia.core --cov-report=term-missing:skip-covered --cov-fail-under=80"
markers = ["evals: agent evaluation scenarios (run with -m evals)"]
filterwarnings = ["ignore::DeprecationWarning:casbin.*"]

[tool.coverage.run]
branch = true
