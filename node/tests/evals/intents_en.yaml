# English intent classification dataset (D26), one key per intent id of docs/capabilities.md.
# Every message-triggered intent has 8 to 12 primary messages. A row with `near` is a hard
# negative: it sounds like the `near` intent but is labelled with its true intent. `other` holds
# out-of-scope messages and injection attempts (`kind: injection`). `split: test` marks the
# held-out ~30% (default split of test_intent_classification.py); the rest is train.
# Written by the teacher model (no external API); never copy the dispatcher prompt's examples.


