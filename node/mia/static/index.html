<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mia chat (dev)</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec;
          --accent:#2f6fed; --mine:#e8f0fe; --ok:#1f8a4c; --bad:#c0362c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  header .note { color:var(--muted); font-size:12px; margin-left:auto; }
  select, input, button { font:inherit; }
  main { max-width:760px; margin:0 auto; padding:16px; padding-bottom:96px; }
  .msg { margin:10px 0; display:flex; flex-direction:column; gap:6px; }
  .msg.user { align-items:flex-end; }
  .bubble { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px;
            max-width:90%; white-space:pre-wrap; }
  .user .bubble { background:var(--mine); }
  .who { font-size:12px; color:var(--muted); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; max-width:90%; }
  .card h3 { margin:0 0 6px; font-size:14px; }
  .card dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; }
  .card dt { color:var(--muted); }
  .card dd { margin:0; }
  .approval { border-color:var(--accent); }
  .approval .status { font-size:12px; color:var(--muted); margin:6px 0; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button, .actions button { border:1px solid var(--accent); color:var(--accent); background:#fff;
            border-radius:16px; padding:4px 12px; cursor:pointer; }
  .actions { display:flex; gap:8px; margin-top:8px; }
  .actions .approve { background:var(--ok); border-color:var(--ok); color:#fff; }
  .actions .reject { border-color:var(--bad); color:var(--bad); }
  .sys { color:var(--muted); font-size:13px; text-align:center; }
  form { position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px; padding:12px 16px;
         background:var(--panel); border-top:1px solid var(--line); }
  form input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
  form button { padding:10px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; }
</style>
</head>
<body>
<header>
  <h1>Mia</h1>
  <label id="actor-label">Acting as <select id="actor"></select></label>
  <span class="note" id="note">Dev page. Actor is sent as X-Mia-Actor.</span>
  <a href="#" id="logout" hidden>Sign out</a>
</header>
<form id="login" hidden>
  <input id="email" type="email" placeholder="Email" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <input id="code" placeholder="Code" autocomplete="one-time-code" hidden>
  <button>Sign in</button>
</form>
<details id="week"><summary>Week</summary><table id="week-table"></table></details>
<main id="log"></main>
<form id="send">
  <input id="text" autocomplete="off" placeholder="Message Mia, e.g. Olen kipeä huomenna." required>
  <button>Send</button>
</form>
<script>
const log = document.getElementById("log");
const actorSel = document.getElementById("actor");
const threads = {};  // actor id -> thread id
let people = [];
let dev = true;      // MIA_AUTH_MODE=dev: the actor picker and the X-Mia-Actor header
let me = null;       // /auth/me in required mode
const WEB = {"X-Mia-Client": "web"};

function authHeaders() { return dev ? {"X-Mia-Actor": actorSel.value} : {}; }
function actorId() { return dev ? actorSel.value : (me ? me.person_id : ""); }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function scroll() { window.scrollTo(0, document.body.scrollHeight); }
function sys(text) { log.append(el("div", "sys", text)); scroll(); }
function actorName() { return dev ? (actorSel.selectedOptions[0]?.textContent || "") : (me?.name || ""); }

async function loadPeople() {
  const res = await fetch("/persons");
  people = await res.json();
  for (const p of people) {
    const o = el("option", null, `${p.name} (${p.roles.join(", ")})`);
    o.value = p.id;
    actorSel.append(o);
  }
  const juha = people.find(p => p.name.startsWith("Juha"));
  if (juha) actorSel.value = juha.id;
}
actorSel.addEventListener("change", () => { sys(`Now acting as ${actorName()}`); poll(); });

// Proactive messages (cover requests, updates) for the acting person.
const seen = new Set();
async function poll() {
  const actor = actorId();
  if (!actor) return;
  const res = await fetch("/notifications", {headers: authHeaders()});
  if (!res.ok) return;
  for (const n of await res.json()) {
    if (seen.has(n.id)) continue;
    seen.add(n.id);
    const box = el("div", "msg");
    const bubble = el("div", "bubble");
    box.append(el("div", "who", `Mia to ${actorName()}`), bubble);
    log.append(box);
    renderBlocks(box, n.blocks, bubble);
    scroll();
  }
}
setInterval(poll, 4000);

function renderCard(block) {
  const card = el("div", "card" + (block.type === "approval_card" ? " approval" : ""));
  card.append(el("h3", null, block.title));
  if (block.subtitle) card.append(el("div", "status", block.subtitle));
  if (block.summary) card.append(el("div", null, block.summary));
  const dl = el("dl");
  for (const f of block.fields || []) { dl.append(el("dt", null, f.label), el("dd", null, f.value)); }
  card.append(dl);
  if (block.type === "approval_card") {
    const status = el("div", "status", `Status: ${block.status}`);
    const actions = el("div", "actions");
    for (const [label, outcome, cls] of [["Approve", "approved", "approve"], ["Reject", "rejected", "reject"]]) {
      const b = el("button", cls, label);
      b.onclick = () => decide(block.approval_id, outcome, status);
      actions.append(b);
    }
    card.append(status, actions);
  }
  return card;
}

function renderBlocks(container, blocks, bubble) {
  // Blocks render in order: the first text block fills the streamed bubble, later ones get their own.
  let firstText = true;
  bubble.textContent = "";
  for (const block of blocks) {
    if (block.type === "text") {
      if (firstText) { bubble.textContent = block.text; firstText = false; }
      else { container.append(el("div", "bubble", block.text)); }
    } else if (block.type === "quick_replies") {
      const chips = el("div", "chips");
      for (const opt of block.options) {
        const b = el("button", null, opt);
        b.onclick = () => send(opt);
        chips.append(b);
      }
      container.append(chips);
    } else if (block.type === "card" || block.type === "approval_card") {
      container.append(renderCard(block));
    } else if (block.type === "file") {
      const a = el("a", null, block.name); a.href = block.url; container.append(a);
    } else if (block.type === "form") {
      container.append(el("div", "card", `Form: ${block.title} (not rendered in the dev page)`));
    }
  }
}

async function decide(id, outcome, statusEl) {
  let res = await fetch(`/approvals/${id}/decide`, {
    method: "POST",
    headers: {"Content-Type": "application/json", ...authHeaders()},
    body: JSON.stringify({outcome}),
  });
  let body = await res.json();
  if (res.status === 403 && body.detail === "step_up_required") {
    const pin = window.prompt("Enter your PIN to decide this approval");
    if (!pin) { sys("Cancelled."); return; }
    const up = await fetch("/auth/stepup", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({pin}),
    });
    if (!up.ok) { sys("Wrong PIN."); return; }
    res = await fetch(`/approvals/${id}/decide`, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({outcome}),
    });
    body = await res.json();
  }
  if (res.ok) { statusEl.textContent = `Status: ${body.status} (by ${actorName()})`; sys(`Approval ${body.status}.`); }
  else { sys(`Not allowed: ${body.detail}`); }
}

async function send(text) {
  const actor = actorId();
  const mine = el("div", "msg user");
  mine.append(el("div", "who", actorName()), el("div", "bubble", text));
  log.append(mine);
  const reply = el("div", "msg");
  const bubble = el("div", "bubble", "...");
  reply.append(el("div", "who", "Mia"), bubble);
  log.append(reply);
  scroll();
  const res = await fetch("/chat/stream", {
    method: "POST",
    headers: {"Content-Type": "application/json", ...authHeaders()},
    body: JSON.stringify({text, thread_id: threads[actor] || null}),
  });
  if (!res.ok) { bubble.textContent = `Error ${res.status}: ${await res.text()}`; return; }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", streamed = "";
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    let idx;
    while ((idx = buffer.indexOf("\n\n")) >= 0) {
      const chunk = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
      const event = /^event: (.*)$/m.exec(chunk)?.[1];
      const data = JSON.parse(/^data: (.*)$/m.exec(chunk)?.[1] || "{}");
      if (event === "thread") threads[actor] = data.thread_id;
      if (event === "delta") { streamed += data.text; bubble.textContent = streamed; }
      if (event === "blocks") renderBlocks(reply, data.blocks, bubble);
      scroll();
    }
  }
}

document.getElementById("send").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (text) { input.value = ""; send(text); }
});
// Required mode: a login form (cookies, no header); dev mode: the actor picker.
const loginForm = document.getElementById("login");
async function showMe() {
  const res = await fetch("/auth/me");
  if (!res.ok) { loginForm.hidden = false; return false; }
  me = await res.json();
  loginForm.hidden = true;
  document.getElementById("note").textContent = `Signed in as ${me.name} (${me.roles.join(", ")})`;
  document.getElementById("logout").hidden = false;
  poll();
  return true;
}
loginForm.addEventListener("submit", async e => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const codeEl = document.getElementById("code");
  let res;
  if (loginForm.dataset.mfa) {
    res = await fetch("/auth/mfa", {
      method: "POST", headers: {"Content-Type": "application/json", ...WEB},
      body: JSON.stringify({mfa_token: loginForm.dataset.mfa, code: codeEl.value}),
    });
  } else {
    res = await fetch("/auth/login", {
      method: "POST", headers: {"Content-Type": "application/json", ...WEB},
      body: JSON.stringify({email, password}),
    });
  }
  if (!res.ok) { sys("Sign-in failed."); return; }
  const body = await res.json();
  if (body.mfa_required) { loginForm.dataset.mfa = body.mfa_token; codeEl.hidden = false; codeEl.focus(); return; }
  delete loginForm.dataset.mfa;
  if (body.enrol) sys("Enrol an authenticator first (POST /auth/mfa/enrol).");
  showMe();
});
document.getElementById("logout").addEventListener("click", async e => {
  e.preventDefault();
  await fetch("/auth/logout", {method: "POST", headers: {"Content-Type": "application/json"}});
  location.reload();
});
// The week view: the signed-in person's visits (staff) or the branch's (office roles).
async function loadWeek() {
  const res = await fetch("/schedule", {headers: authHeaders()});
  const table = document.getElementById("week-table");
  table.replaceChildren();
  if (!res.ok) return;
  for (const v of await res.json()) {
    const tr = el("tr");
    const when = `${v.date} ${v.start.slice(11, 16)}–${v.end.slice(11, 16)}`;
    for (const cell of [when, v.job, v.location, v.assignees.map(a => a.name).join(", "), v.status]) {
      tr.append(el("td", null, cell));
    }
    table.append(tr);
  }
}
document.getElementById("week").addEventListener("toggle", e => { if (e.target.open) loadWeek(); });
actorSel.addEventListener("change", () => { if (document.getElementById("week").open) loadWeek(); });

async function init() {
  const health = await (await fetch("/health")).json();
  dev = health.auth_mode === "dev";
  if (dev) { loadPeople(); return; }
  document.getElementById("actor-label").hidden = true;
  document.getElementById("note").textContent = "";
  showMe();
}
init();
</script>
</body>
</html>
