id: sales_supervisor
name: Sales Supervisor
version: 0.1.0
standard_version: "1.9"
job_description: job.md
instructions: {base: prompts/base.md}
roles:
  agent_role: agent.sales_supervisor
  grants:
    - data:sales_counts:read
    - data:sales_counts:write
    - data:sales_counts:read_all
    - data:sales_targets:read
    - data:sales_targets:write
    - data:sales_targets:write_all
    - data:sales_notes:write
    - data:retail_items:read
    - data:retail_branch_hours:read
    - data:core.person:read
    - data:core.branch:read
    - tool:sales_supervisor.record_counts:execute
    - tool:sales_supervisor.correct_count:execute
    - tool:sales_supervisor.today:execute
    - tool:sales_supervisor.period_report:execute
    - tool:sales_supervisor.set_target:execute
    - tool:sales_supervisor.record_note:execute
  denies: [tool:*:approve]
tools:
  - {id: sales_supervisor.record_counts, kind: agent, risk: write_internal, approval: never, reads: [retail_items, retail_branch_hours, sales_counts, sales_targets], writes: [sales_counts]}
  - {id: sales_supervisor.correct_count, kind: agent, risk: write_internal, approval: never, reads: [retail_items, retail_branch_hours, sales_counts], writes: [sales_counts]}
  - {id: sales_supervisor.today, kind: agent, risk: read, approval: never, reads: [retail_items, retail_branch_hours, sales_counts, sales_targets, person, branch]}
  - {id: sales_supervisor.period_report, kind: agent, risk: read, approval: never, reads: [retail_items, sales_counts, branch]}
  - {id: sales_supervisor.set_target, kind: agent, risk: write_internal, approval: never, reads: [branch], writes: [sales_targets]}
  - {id: sales_supervisor.record_note, kind: agent, risk: write_internal, approval: never, writes: [sales_notes]}
tests: {suite: tests/scenarios.yaml, min_pass_rate: 0.9}
