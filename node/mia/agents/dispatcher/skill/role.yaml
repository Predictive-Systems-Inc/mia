# Seed plan for the dispatcher role: the intents the agent handles today (routing needs a plan
# before the first model exists). The training plan may grow it; ids must stay stable.
id: dispatcher
job_summary: Keeps every visit staffed by recording absences and finding cover.
responsibilities:
  - record absences reported by cleaners
  - tell cleaners about their visits
  - find and assign cover for uncovered visits
counterparts:
  - {role: cleaner, share: 0.8, channel: whatsapp}
  - {role: supervisor, share: 0.2, channel: web}
languages: [en, fi]
countries: [FI]
styles: {informal: 0.3, terse: 0.15, typo: 0.15, indirect: 0.15, formal: 0.1, mixed: 0.1, context: 0.05}
intents:
  - id: dispatcher.report_absence
    description: Cannot work a day or a visit (sick, late, leaving early).
    counterparts: [cleaner]
    risk: write
    label_en: Report I'm sick
    slots: [reason, partial_day]
    handler: agent
    volume: high
  - id: dispatcher.absence_scope
    description: Says which visits an absence covers (whole day, morning only, afternoon only).
    counterparts: [cleaner]
    risk: write
    label_en: Which visits
    handler: agent
    follow_up: true
  - id: dispatcher.my_visits
    description: Asks about their own visits or schedule.
    counterparts: [cleaner]
    risk: read
    label_en: Show my visits
    handler: agent
  - id: dispatcher.find_cover
    description: Asks for someone to cover a visit.
    counterparts: [supervisor]
    risk: read
    label_en: Find cover
    handler: agent
  - id: dispatcher.assign
    description: Instructs Mia to assign a named person to cover a visit.
    counterparts: [supervisor]
    risk: write
    label_en: Assign cover
    handler: agent
  - id: dispatcher.cover_reply
    description: Answers a cover request (accepts or declines).
    counterparts: [cleaner]
    risk: write
    label_en: Answer cover
    handler: agent
    follow_up: true
