# Alembic config for the Mia Node. `uv run mia migrate` sets script_location and the database
# url from settings (MIA_DB_PATH), so these values are only defaults for the alembic CLI.
[alembic]
script_location = %(here)s
sqlalchemy.url = sqlite:///data/mia.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
